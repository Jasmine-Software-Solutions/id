# Only the embed surface may be framed, and only by our own sites. Everything
# else keeps `frame-ancestors 'self'`, replacing the old blanket
# X-Frame-Options: SAMEORIGIN, which could not be relaxed for one path.
#
# This is keyed off $request_uri, not $uri: the SPA fallback below does an
# internal redirect to /index.html, which rewrites $uri and would silently
# downgrade /embed to the default policy. $request_uri is the original request
# and includes the query string, hence the `?` in the character class.
# The regex matches `/embed` and `/embed/…` and `/embed?…`, not `/embedding-…`.
map $request_uri $frame_ancestors {
    ~^/embed([/?]|$)   "'self' https://*.jasmine.software http://localhost:* http://*.localhost:*";
    default            "'self'";
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header Content-Security-Policy "frame-ancestors $frame_ancestors" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Cache static assets (hashed Vite assets get immutable 1-year cache)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
